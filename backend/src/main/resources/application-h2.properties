# H2 in-memory database profile.
# Nothing to install - Spring Boot starts an in-memory database when the
# application starts and throws it away when the application stops.
# A few sample products are inserted automatically on startup by
# data.sql (see src/main/resources/data.sql), so GET /api/products returns
# real data immediately.

spring.datasource.url=jdbc:h2:mem:smartstockdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Optional: lets you open http://localhost:8080/h2-console in a browser to
# inspect the in-memory "product" table directly (JDBC URL above, user "sa",
# blank password).
spring.h2.console.enabled=true

spring.jpa.show-sql=true
