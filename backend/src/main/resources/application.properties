# ============================================================
# SmartStock backend configuration
# ============================================================
# Default profile = H2 (an in-memory database that needs nothing installed).
# This lets you run the whole project with a single command for your demo.
# To use real MySQL instead (matching the architecture in your report),
# switch the active profile below to "mysql" and fill in your MySQL
# username/password in application-mysql.properties.

spring.application.name=smartstock-backend
server.port=8080

spring.profiles.active=mysql
