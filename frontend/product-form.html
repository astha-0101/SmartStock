<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartStock - Add Product</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-box">S</div>
      <div class="logo-text"><b>SmartStock</b><span>INVENTORY SYSTEM</span></div>
    </div>
    <div class="menu-label">MENU</div>
    <nav class="menu">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="products.html" class="active">📦 Products</a>
      <a href="inventory.html">🗃️ Inventory</a>
      <a href="orders.html">🛒 Orders <span class="badge">3</span></a>
      <a href="#">🚚 Suppliers</a>
      <a href="#">📈 Analytics</a>
      <a href="forecast.html">🔮 Forecast</a>
      <a href="#">👤 Profile</a>
    </nav>
  </aside>

  <div class="main">
    <header class="navbar">
      <h2>Add Product</h2>
      <div class="search-bar">🔍 <input type="text" placeholder="Search products, orders..."></div>
      <div class="nav-right">
        <div class="icon-btn">🔔</div>
        <div class="profile"><div class="avatar">AS</div><span>Astha Singh</span></div>
      </div>
    </header>

    <main class="content">
      <div class="page-head"><div><h1>Add Product</h1><p>Fill in the details to add a new product</p></div></div>

      <form class="card" style="max-width:800px;">
        <div class="form-grid">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" placeholder="e.g. Wireless Mouse">
          </div>
          <div class="form-group">
            <label>SKU</label>
            <input type="text" placeholder="e.g. EL-1032">
          </div>
          <div class="form-group">
            <label>Category</label>
            <select>
              <option>Electronics</option>
              <option>Stationery</option>
              <option>Furniture</option>
            </select>
          </div>
          <div class="form-group">
            <label>Supplier</label>
            <select>
              <option>TechZone Ltd</option>
              <option>OfficeHub</option>
              <option>WorkSpace Pro</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Initial Stock</label>
            <input type="number" placeholder="0">
          </div>
          <div class="form-group">
            <label>Reorder Level</label>
            <input type="number" placeholder="0">
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
          </div>
          <div class="form-group full">
            <label>Description</label>
            <textarea rows="4" placeholder="Short product description..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Product</button>
          <a href="products.html" class="btn">Cancel</a>
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
